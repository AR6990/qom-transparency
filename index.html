<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سامانۀ شفافیت شهرداری قم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: #e6eaf2;
      --text: #1a2238;
      --text-muted: #6b7590;
      --primary: #0d6e6e;
      --primary-2: #0f8b8b;
      --primary-soft: #e0f2f1;
      --accent: #f5a524;
      --accent-soft: #fef3d7;
      --blue: #2563eb;
      --blue-soft: #e3ecfd;
      --purple: #7c3aed;
      --purple-soft: #efe7fd;
      --pink: #db2777;
      --pink-soft: #fce5f0;
      --green: #059669;
      --green-soft: #d8f5e9;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.04);
      --shadow: 0 4px 16px rgba(16,24,40,.06);
      --shadow-lg: 0 12px 32px rgba(16,24,40,.10);
      --font: 'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    }
    *,*::before,*::after { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font);
      background: var(--bg); color: var(--text);
      line-height: 1.75; font-size: 15px;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ====== Topbar ====== */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar__inner {
      max-width: 1200px; margin: 0 auto;
      padding: 14px 24px;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; }
    .brand__logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      display: grid; place-items: center; color: #fff; font-size: 1rem;
      box-shadow: 0 4px 12px rgba(13,110,110,.35);
    }
    .brand__sub { color: var(--text-muted); font-weight: 500; font-size: .8rem; }
    .search { flex: 1; max-width: 460px; position: relative; }
    .search input {
      width: 100%; padding: 10px 44px 10px 16px;
      border: 1px solid var(--border); border-radius: 999px;
      background: #f8fafc; font-family: inherit; font-size: .9rem;
      transition: all .2s;
    }
    .search input:focus {
      outline: none; background: #fff; border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }
    .search::before {
      content: "🔍"; position: absolute;
      inset-inline-end: 16px; top: 50%; transform: translateY(-50%);
      opacity: .55; font-size: .85rem;
    }

    /* ====== Main layout ====== */
    .main { max-width: 1200px; margin: 0 auto; padding: 36px 24px 60px; }

    .page-title {
      display: flex; align-items: center; gap: 10px;
      margin: 0 0 24px;
    }
    .page-title h1 {
      font-size: 1.25rem; font-weight: 800; margin: 0;
    }
    .page-title h1::before {
      content: ""; display: inline-block; vertical-align: middle;
      width: 6px; height: 22px; border-radius: 4px;
      background: linear-gradient(180deg, var(--primary), var(--primary-2));
      margin-inline-end: 10px;
    }

    /* ====== Category cards ====== */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .cat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
      display: flex; flex-direction: column; gap: 14px;
      position: relative; overflow: hidden;
    }
    .cat-card::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(13,110,110,.03));
      pointer-events: none; opacity: 0; transition: opacity .22s;
    }
    .cat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: transparent;
    }
    .cat-card:hover::after { opacity: 1; }
    .cat-card h3 { font-size: 1.02rem; font-weight: 700; margin: 0; }
    .cat-card p {
      margin: 0; font-size: .84rem; color: var(--text-muted);
      flex: 1; line-height: 1.65;
    }
    .cat-card__meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .78rem; color: var(--text-muted);
      padding-top: 12px; border-top: 1px dashed var(--border);
    }
    .cat-card__arrow {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--bg);
      display: grid; place-items: center;
      font-size: .8rem; color: var(--text-muted);
      transition: all .2s;
    }
    .cat-card:hover .cat-card__arrow {
      background: var(--primary); color: #fff; transform: translateX(-4px);
    }

    /* ====== Icon chips ====== */
    .card__icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: grid; place-items: center; font-size: 1.4rem;
      flex-shrink: 0;
    }
    .card__icon--teal   { background: var(--primary-soft); color: var(--primary); }
    .card__icon--blue   { background: var(--blue-soft);    color: var(--blue); }
    .card__icon--purple { background: var(--purple-soft);  color: var(--purple); }
    .card__icon--pink   { background: var(--pink-soft);    color: var(--pink); }
    .card__icon--green  { background: var(--green-soft);   color: var(--green); }
    .card__icon--amber  { background: var(--accent-soft);  color: #b45309; }

    /* ====== Aux block (no label) ====== */
    .aux-block {
      margin-top: 44px;
      padding: 24px;
      background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
      border: 1px solid #fde68a;
      border-radius: 22px;
      box-shadow: var(--shadow-sm);
    }
    .aux-block .cat-card {
      background: #fff;
      border-color: #fde68a;
    }
    .aux-block .cat-card:hover {
      border-color: transparent;
    }

    /* ====== Detail view ====== */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 999px;
      font-size: .82rem; color: var(--text-muted); font-weight: 500;
      cursor: pointer; margin-bottom: 20px;
      transition: all .18s;
    }
    .back-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-soft); }

    .detail-head {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 26px; flex-wrap: wrap;
    }
    .detail-head h1 { font-size: 1.3rem; font-weight: 800; margin: 0 0 4px; }
    .detail-head p { margin: 0; font-size: .85rem; color: var(--text-muted); }

    .sub-toolbar {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .sub-toolbar button {
      background: var(--surface); border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 999px;
      font-size: .78rem; color: var(--text-muted); cursor: pointer;
      transition: all .18s;
    }
    .sub-toolbar button:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-soft); }

    .sub-list { display: grid; gap: 16px; }
    .sub-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s;
    }
    .sub-card:hover { box-shadow: var(--shadow); }
    .sub-card__head {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      gap: 16px; padding: 20px 24px;
      background: transparent; border: none;
      text-align: right; cursor: pointer; color: inherit;
      transition: background .15s;
    }
    .sub-card__head:hover { background: #f8fafc; }
    .sub-card__head h3 { margin: 0 0 4px; font-size: .98rem; font-weight: 700; }
    .sub-card__head p { margin: 0; font-size: .82rem; color: var(--text-muted); }
    .sub-card__chev {
      color: var(--text-muted); font-size: .9rem;
      transition: transform .2s;
    }
    .sub-card.is-open .sub-card__chev { transform: rotate(180deg); }
    .sub-card__body {
      padding: 0 24px 24px;
      border-top: 1px solid var(--border);
    }
    .sub-card__body > * + * { margin-top: 16px; }

    .mini-title {
      font-size: .82rem; font-weight: 700; color: var(--text-muted);
      margin: 4px 0 0; padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    /* ====== KPI ====== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .kpi {
      background: #f8fafc; border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
    }
    .kpi__label { font-size: .74rem; color: var(--text-muted); }
    .kpi__value { font-size: 1.3rem; font-weight: 800; margin: 2px 0; line-height: 1.2; }
    .kpi__unit { font-size: .72rem; color: var(--text-muted); }

    /* ====== Table ====== */
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    th, td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--border); }
    th {
      font-weight: 600; color: var(--text-muted); font-size: .76rem;
      background: #f8fafc; white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    td { vertical-align: middle; }

    /* ====== Tag ====== */
    .tag {
      display: inline-block; font-size: .72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    }
    .tag--green { background: var(--green-soft);  color: var(--green); }
    .tag--blue  { background: var(--blue-soft);   color: var(--blue); }
    .tag--amber { background: var(--accent-soft); color: #b45309; }
    .tag--pink  { background: var(--pink-soft);   color: var(--pink); }
    .tag--gray  { background: #eef1f6;            color: #475569; }

    /* ====== Progress ====== */
    .progress {
      height: 8px; border-radius: 999px;
      background: #eef1f6; overflow: hidden; flex: 1;
    }
    .progress__bar {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
    }
    .progress__bar--blue  { background: linear-gradient(90deg, #2563eb, #3b82f6); }
    .progress__bar--amber { background: linear-gradient(90deg, #d97706, #f59e0b); }
    .progress__bar--pink  { background: linear-gradient(90deg, #be185d, #ec4899); }
    .progress-cell {
      display: flex; align-items: center; gap: 8px; min-width: 150px;
    }
    .progress-cell span { font-size: .74rem; color: var(--text-muted); white-space: nowrap; }

    /* ====== Footer ====== */
    .footer {
      background: #0f172a; color: #cbd5e1;
      padding: 28px 24px; margin-top: 40px;
    }
    .footer__inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; justify-content: space-between; gap: 20px;
      flex-wrap: wrap; font-size: .82rem;
    }
    .footer strong { color: #fff; }

    /* ====== Responsive ====== */
    @media (max-width: 520px) {
      .main { padding: 24px 16px 48px; }
      .topbar__inner { padding: 12px 16px; }
      .cat-grid { grid-template-columns: 1fr; }
      .sub-card__head { padding: 16px; }
      .sub-card__body { padding: 0 16px 18px; }
    }
  </style>
</head>
<body>

  <!-- ====== Topbar ====== -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__logo">ش</div>
        <div>
          <div>سامانۀ شفافیت</div>
          <div class="brand__sub">شهرداری قم</div>
        </div>
      </div>
      <div class="search">
        <input type="search" placeholder="جستجو در موضوعات شفافیت..." aria-label="جستجو" />
      </div>
    </div>
  </header>

  <!-- ====== App ====== -->
  <main class="main" id="app">

    <!-- صفحهٔ اول: فقط کارت‌های دسته‌بندی -->
    <div id="home-view">
      <div class="page-title"><h1>دسته‌بندی‌های سامانه</h1></div>
      <div class="cat-grid" id="cat-grid"></div>
      <!-- بلوک مجزا (بدون برچسب) -->
      <div class="aux-block">
        <div class="cat-grid" id="aux-grid"></div>
      </div>
    </div>

    <!-- صفحهٔ زیرمجموعه‌ها -->
    <div id="detail-view" hidden></div>

  </main>

  <!-- ====== Footer ====== -->
  <footer class="footer">
    <div class="footer__inner">
      <div>
        <strong>سامانۀ شفافیت شهرداری قم</strong><br />
        این صفحه یک قالب نمایشی است و داده‌های آن نمونه هستند.
      </div>
      <div>آخرین به‌روزرسانی: <strong>۱۴۰۵/۰۸/۰۱</strong></div>
    </div>
  </footer>

  <script>
    /* ============================================================
       ابزارهای ساخت HTML
       ============================================================ */
    function table(headers, rows) {
      const head = headers.map(h => `<th>${h}</th>`).join('');
      const body = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }
    function kpis(items) {
      return `<div class="kpi-grid">${items.map(([label, value, unit]) => `
        <div class="kpi">
          <div class="kpi__label">${label}</div>
          <div class="kpi__value">${value}</div>
          <div class="kpi__unit">${unit || ''}</div>
        </div>`).join('')}</div>`;
    }
    function tag(text, type) { return `<span class="tag tag--${type}">${text}</span>`; }
    function progressCell(label, width, color) {
      return `<div class="progress-cell">
        <div class="progress"><div class="progress__bar ${color || ''}" style="width:${width}%"></div></div>
        <span>${label}</span>
      </div>`;
    }

    /* ============================================================
       داده‌های فرضی — دسته‌بندی‌های اصلی
       ============================================================ */
    const CATEGORIES = [
      /* ---------------- ۱. مالی و اقتصادی ---------------- */
      {
        id: 'financial',
        title: 'مالی و اقتصادی',
        icon: '💰',
        color: 'teal',
        desc: 'بودجه، قراردادها، فراخوان‌ها، تأمین‌کنندگان، مطالبات و معافیت‌ها',
        subs: [
          {
            title: 'برنامه و بودجه',
            desc: 'بودجه‌های پیشنهادی، مصوب، اصلاحی و تفریغ به همراه گزارش عملکرد',
            html: `
              ${kpis([
                ['بودجه مصوب ۱۴۰۵', '۱۲,۵۰۰', 'میلیارد تومان'],
                ['تحقق بودجه ۱۴۰۴', '۹۴٪', 'از مصوب'],
                ['تفریغ بودجه ۱۴۰۳', '۱۰,۴۲۰', 'میلیارد تومان'],
                ['سهم عمرانی', '۴۱٪', 'از کل بودجه']
              ])}
              ${table(
                ['سال', 'پیشنهادی', 'مصوب', 'اصلاحی', 'تفریغ', 'تحقق'],
                [
                  ['۱۴۰۱', '۷,۲۰۰',  '۷,۵۰۰',  '۷,۸۵۰',  '۷,۳۱۰',  '۹۷٪'],
                  ['۱۴۰۲', '۸,۱۰۰',  '۸,۹۰۰',  '۹,۲۰۰',  '۸,۷۶۰',  '۹۵٪'],
                  ['۱۴۰۳', '۹,۶۰۰',  '۱۰,۲۰۰', '۱۰,۵۰۰', '۱۰,۴۲۰', '۱۰۲٪'],
                  ['۱۴۰۴', '۱۱,۰۰۰', '۱۱,۶۰۰', '۱۱,۹۰۰', '—',      '—'],
                  ['۱۴۰۵', '۱۲,۳۰۰', '۱۲,۵۰۰', '—',      '—',      '—']
                ]
              )}
            `
          },
          {
            title: 'قراردادها، تفاهم‌نامه‌ها و معاملات',
            desc: 'متن و مستندات قراردادهای هزینه‌ای، درآمدی، سرمایه‌گذاری و اجارۀ املاک',
            html: `
              ${kpis([
                ['کل قراردادها', '۱,۲۴۸', 'مورد'],
                ['قراردادهای جاری', '۳۱۲', 'مورد'],
                ['خاتمه‌یافته', '۹۳۶', 'مورد'],
                ['ارزش کل', '۸,۴۰۰', 'میلیارد تومان']
              ])}
              ${table(
                ['شماره', 'موضوع', 'طرف قرارداد', 'نوع', 'مبلغ (م.ت)', 'تاریخ', 'وضعیت'],
                [
                  ['۱۴۰۵/۰۱۲۳', 'احداث پل عابر پیاده بلوار امین', 'شرکت عمران سازه پارس', 'عمرانی', '۴۸,۵۰۰', '۱۴۰۵/۰۷/۱۲', tag('جاری', 'green')],
                  ['۱۴۰۵/۰۱۱۸', 'خرید ماشین‌آلات خدمات شهری', 'شرکت تجهیزات مدرن', 'خرید', '۱۲۲,۰۰۰', '۱۴۰۵/۰۷/۰۵', tag('جاری', 'green')],
                  ['۱۴۰۵/۰۰۹۴', 'اجارۀ ساختمان اداری منطقه ۳', 'آقای محمد رضایی', 'اجاره', '۹,۶۰۰', '۱۴۰۵/۰۶/۲۸', tag('خاتمه‌یافته', 'blue')],
                  ['۱۴۰۵/۰۰۸۷', 'طراحی و اجرای فضای سبز بلوار غدیر', 'شرکت سبزآوران', 'عمرانی', '۳۲,۴۰۰', '۱۴۰۵/۰۶/۱۵', tag('جاری', 'green')],
                  ['۱۴۰۵/۰۰۷۶', 'سرمایه‌گذاری پروژه تجاری میدان مطهری', 'هلدینگ توسعه شهری', 'سرمایه‌گذاری', '۴۵۰,۰۰۰', '۱۴۰۵/۰۵/۳۰', tag('در بررسی', 'amber')]
                ]
              )}
              <h4 class="mini-title">تفاهم‌نامه‌های اخیر</h4>
              ${table(
                ['شماره', 'موضوع', 'طرف تفاهم‌نامه', 'تاریخ'],
                [
                  ['۱۴۰۵/ت-۰۴۲', 'همکاری در هوشمندسازی پارکینگ‌های عمومی', 'شرکت دانش‌بنیان پارکینگ هوشمند', '۱۴۰۵/۰۷/۰۲'],
                  ['۱۴۰۵/ت-۰۳۱', 'توسعه فضای سبز با مشارکت بخش خصوصی', 'شرکت سبزآوران', '۱۴۰۵/۰۶/۲۰'],
                  ['۱۴۰۵/ت-۰۱۸', 'آموزش شهروندی در مدارس', 'اداره کل آموزش و پرورش استان قم', '۱۴۰۵/۰۵/۱۰']
                ]
              )}
            `
          },
          {
            title: 'فراخوان‌ها، مزایدات و مناقصات',
            desc: 'فهرست فراخوان‌ها، مزایدات و مناقصات جاری با قابلیت جستجو',
            html: table(
              ['شماره', 'عنوان', 'نوع', 'مهلت ارسال', 'وضعیت'],
              [
                ['۱۴۰۵/ف-۲۱۰', 'مناقصه احداث پارکینگ طبقاتی منطقه ۴', 'مناقصه', '۱۴۰۵/۰۸/۱۵', tag('فعال', 'green')],
                ['۱۴۰۵/ف-۲۰۹', 'مزایده اجارۀ مغازه‌های تجاری بلوار امین', 'مزایده', '۱۴۰۵/۰۸/۱۰', tag('فعال', 'green')],

                ['داده‌های سامانۀ ۱۳۷', 'CSV', '۱۴۰۵/۰۷/۲۸', '۳۲ مگابایت'],
                ['داده‌های ترافیکی مناطق', 'JSON', '۱۴۰۵/۰۷/۲۰', '۸۵ مگابایت'],
                ['نتایج نظرسنجی رضایت شهروندی', 'PDF', '۱۴۰۵/۰۵/۳۰', '۲ مگابایت']
              ]
            )
          }
        ]
      },

      /* ---------------- ۷. گزارش‌های مردمی (دستۀ مستقل) ---------------- */
      {
        id: 'citizen',
        title: 'گزارش‌های مردمی',
        icon: '📊',
        color: 'amber',
        desc: 'گزارش سامانۀ ۱۳۷ و نتایج دیگر نظرسنجی‌های مردمی',
        subs: [
          {
            title: 'گزارش سامانۀ ۱۳۷',
            desc: 'آمار گزارش‌های ثبت‌شده و وضعیت رسیدگی به تفکیک منطقه',
            html: `
              ${kpis([
                ['گزارش سال جاری', '۱۲,۳۰۰', 'مورد'],
                ['رسیدگی‌شده', '۱۱,۴۶۰', 'مورد'],
                ['میانگین زمان رسیدگی', '۴.۲', 'روز'],
                ['رضایت ثبت‌شده', '۸۲٪', '—']
              ])}
              ${table(
                ['منطقه', 'تعداد گزارش', 'رسیدگی‌شده', 'میانگین زمان'],
                [
                  ['منطقه ۱', '۲,۴۱۰', '۲,۲۸۰', '۳.۸ روز'],
                  ['منطقه ۲', '۲,۹۸۰', '۲,۷۶۰', '۴.۱ روز'],
                  ['منطقه ۳', '۱,۸۶۰', '۱,۷۴۰', '۴.۰ روز'],
                  ['منطقه ۴', '۱,۴۲۰', '۱,۳۱۰', '۴.۵ روز'],
                  ['منطقه ۵', '۲,۱۰۰', '۱,۹۸۰', '۴.۳ روز'],
                  ['منطقه ۶', '۱,۵۳۰', '۱,۳۹۰', '۴.۷ روز']
                ]
              )}
            `
          },
          {
            title: 'دیگر نظرسنجی‌های مردمی',
            desc: 'نتایج نظرسنجی‌های انجام‌شده در پروژه‌های مختلف',
            html: table(
              ['عنوان نظرسنجی', 'تعداد نمونه', 'نتیجه کلیدی', 'تاریخ'],
              [
                ['رضایت از خدمات پسماند', '۲,۵۰۰', '۷۸٪ رضایت', '۱۴۰۵/۰۶/۲۰'],
                ['ارزیابی پروژه بازآفرینی بازار', '۸۰۰', '۶۵٪ رضایت', '۱۴۰۵/۰۵/۱۵'],
                ['نظرسنجی حمل‌ونقل عمومی', '۱,۲۰۰', '۵۸٪ رضایت', '۱۴۰۵/۰۴/۳۰'],
                ['رضایت از سامانه ۱۳۷', '۳,۰۰۰', '۸۲٪ رضایت', '۱۴۰۵/۰۷/۱۰']
              ]
            )
          }
        ]
      }
    ];

    /* ============================================================
       بلوک مجزا (بدون برچسب)
       ============================================================ */
    const AUX = [
      {
        title: 'حمایت از گزارشگران فساد',
        icon: '🛡️',
        color: 'amber',
        desc: 'سازوکارهای تشویقی و حمایتی برای گزارش‌دهندگان فساد',
        html: `
          ${kpis([
            ['گزارش‌های دریافتی', '۲۴', 'مورد'],
            ['منجر به بررسی', '۱۷', 'مورد'],
            ['پاداش پرداخت‌شده', '۳', 'مورد']
          ])}
          ${table(
            ['سازوکار', 'وضعیت'],
            [
              ['پاداش نقدی به گزارش‌های مؤثر', tag('فعال', 'green')],
              ['حمایت حقوقی از گزارش‌دهنده', tag('فعال', 'green')],
              ['محرمانگی هویت گزارش‌دهنده', tag('تضمین‌شده', 'blue')]
            ]
          )}
        `
      },
      {
        title: 'نظرات و پیشنهادات',
        icon: '💬',
        color: 'teal',
        desc: 'ارسال نظر و پیشنهاد درخصوص سامانۀ شفافیت',
        html: `
          ${kpis([
            ['پیشنهادهای دریافتی', '۱۴۲', 'مورد'],
            ['پیشنهادهای پذیرفته‌شده', '۳۸', 'مورد'],
            ['میانگین زمان پاسخ', '۶', 'روز']
          ])}
          ${table(
            ['موضوع', 'تعداد', 'وضعیت'],
            [
              ['بهبود رابط کاربری', '۵۴', tag('در حال بررسی', 'amber')],
              ['افزودن داده‌های جدید', '۶۲', tag('پذیرفته‌شده', 'green')],
              ['اصلاح اطلاعات', '۲۶', tag('انجام‌شده', 'blue')]
            ]
          )}
        `
      },
      {
        title: 'سامانۀ ۱۳۷ و شکایات مردمی',
        icon: '📞',
        color: 'blue',
        desc: 'ثبت و پیگیری شکایات مردمی از طریق سامانۀ ۱۳۷',
        html: `
          ${kpis([
            ['شکایات ثبت‌شده', '۱۲,۳۰۰', 'مورد'],
            ['مختومه‌شده', '۱۱,۴۶۰', 'مورد'],
            ['در دست بررسی', '۸۴۰', 'مورد']
          ])}
          ${table(
            ['نوع شکایت', 'تعداد', 'میانگین زمان رسیدگی'],
            [
              ['خدمات شهری', '۴,۸۰۰', '۳.۹ روز'],
              ['عمرانی', '۳,۲۰۰', '۴.۶ روز'],
              ['شهرسازی', '۲,۴۰۰', '۵.۱ روز'],
              ['سایر', '۱,۹۰۰', '۴.۲ روز']
            ]
          )}
        `
      }
    ];

    /* ============================================================
       رندر صفحهٔ اول
       ============================================================ */
    const homeView   = document.getElementById('home-view');
    const detailView = document.getElementById('detail-view');
    const catGrid    = document.getElementById('cat-grid');
    const auxGrid    = document.getElementById('aux-grid');

    function renderHome() {
      catGrid.innerHTML = CATEGORIES.map(cat => `
        <article class="cat-card" data-cat="${cat.id}" role="button" tabindex="0">
          <div class="card__icon card__icon--${cat.color}">${cat.icon}</div>
          <h3>${cat.title}</h3>
          <p>${cat.desc}</p>
          <div class="cat-card__meta">
            <span>${cat.subs.length} زیربخش</span>
            <span class="cat-card__arrow">←</span>
          </div>
        </article>
      `).join('');

      auxGrid.innerHTML = AUX.map((a, i) => `
        <article class="cat-card" data-aux="${i}" role="button" tabindex="0">
          <div class="card__icon card__icon--${a.color}">${a.icon}</div>
          <h3>${a.title}</h3>
          <p>${a.desc}</p>
          <div class="cat-card__meta">
            <span>مشاهده جزئیات</span>
            <span class="cat-card__arrow">←</span>
          </div>
        </article>
      `).join('');
    }

    /* ============================================================
       ناوبری
       ============================================================ */
    function showHome() {
      detailView.hidden = true;
      homeView.hidden   = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openCategory(id) {
      const cat = CATEGORIES.find(c => c.id === id);
      if (!cat) return;

      detailView.innerHTML = `
        <button class="back-btn" type="button" id="back-btn">→ بازگشت به صفحه اصلی</button>
        <div class="detail-head">
          <div class="card__icon card__icon--${cat.color}">${cat.icon}</div>
          <div>
            <h1>${cat.title}</h1>
            <p>${cat.desc}</p>
          </div>
        </div>
        <div class="sub-toolbar">
          <button type="button" onclick="toggleAll(true)">باز کردن همه</button>
          <button type="button" onclick="toggleAll(false)">جمع کردن همه</button>
        </div>
        <div class="sub-list">
          ${cat.subs.map((s, i) => `
            <article class="sub-card is-open" data-sub="${i}">
              <button type="button" class="sub-card__head">
                <div>
                  <h3>${s.title}</h3>
                  <p>${s.desc || ''}</p>
                </div>
                <span class="sub-card__chev">▾</span>
              </button>
              <div class="sub-card__body">${s.html}</div>
            </article>
          `).join('')}
        </div>
      `;

      homeView.hidden   = true;
      detailView.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.getElementById('back-btn').addEventListener('click', showHome);
    }

    function openAux(index) {
      const a = AUX[index];
      if (!a) return;

      detailView.innerHTML = `
        <button class="back-btn" type="button" id="back-btn">→ بازگشت به صفحه اصلی</button>
        <div class="detail-head">
          <div class="card__icon card__icon--${a.color}">${a.icon}</div>
          <div>
            <h1>${a.title}</h1>
            <p>${a.desc}</p>
          </div>
        </div>
        <div class="sub-card is-open">
          <div class="sub-card__body" style="border-top:none; padding-top:0;">${a.html}</div>
        </div>
      `;

      homeView.hidden   = true;
      detailView.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.getElementById('back-btn').addEventListener('click', showHome);
    }

    /* ============================================================
       باز/بسته کردن زیربخش‌ها
       ============================================================ */
    function toggleAll(open) {
      document.querySelectorAll('.sub-card').forEach(card => {
        card.classList.toggle('is-open', open);
        const body = card.querySelector('.sub-card__body');
        if (body) body.hidden = !open;
      });
    }

    detailView.addEventListener('click', (e) => {
      const head = e.target.closest('.sub-card__head');
      if (!head) return;
      const card = head.parentElement;
      const body = card.querySelector('.sub-card__body');
      const isOpen = card.classList.toggle('is-open');
      if (body) body.hidden = !isOpen;
    });

    /* ============================================================
       رویداد کلیک روی کارت‌ها
       ============================================================ */
    catGrid.addEventListener('click', (e) => {
      const card = e.target.closest('[data-cat]');
      if (card) openCategory(card.dataset.cat);
    });

    auxGrid.addEventListener('click', (e) => {
      const card = e.target.closest('[data-aux]');
      if (card) openAux(Number(card.dataset.aux));
    });

    // دسترسی با کیبورد
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        const focused = document.activeElement;
        if (focused && focused.matches('[data-cat], [data-aux]')) {
          e.preventDefault();
          focused.click();
        }
      }
    });

    /* ============================================================
       شروع
       ============================================================ */
    renderHome();
  </script>
</body>
</html>
